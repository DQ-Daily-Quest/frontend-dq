<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08 · 꾸미기 (아바타 · 우리 집) | Daily Quest</title>
  <link rel="stylesheet" href="../css/common.css">
  <script src="../js/fit.js"></script>
  <link rel="stylesheet" href="../css/customize.css">
</head>
<body>
  <div class="screen">
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <img class="status-bar__ind" src="../assets/icon/status-indicators.svg" alt="">
    </div>

    <h1 class="deco-title">꾸미기</h1>
    <span class="coin-pill deco-coin"><img src="../assets/icon/coin.svg" alt="코인">320<img src="../assets/icon/plus-circle.svg" alt="코인 충전"></span>

    <div class="segment" role="tablist" data-select="single">
      <button type="button" class="segment__item is-active" role="tab" aria-selected="true" data-option>아바타</button>
      <button type="button" class="segment__item" role="tab" aria-selected="false" data-option>우리 집</button>
    </div>

    <div class="deco-preview">
      <img class="deco-preview__bg" src="../assets/img/room-interior.png" alt="">
      <span class="avatar"><img src="../assets/img/avatar-girl.png" alt="내 아바타 미리보기"></span>
    </div>

    <nav class="cat-tabs" role="tablist" data-select="single">
      <button type="button" class="cat-tabs__item" role="tab" aria-selected="false" data-option>머리</button>
      <button type="button" class="cat-tabs__item is-active" role="tab" aria-selected="true" data-option>옷</button>
      <button type="button" class="cat-tabs__item" role="tab" aria-selected="false" data-option>소품</button>
      <button type="button" class="cat-tabs__item" role="tab" aria-selected="false" data-option>표정</button>
      <button type="button" class="cat-tabs__item" role="tab" aria-selected="false" data-option>배경</button>
    </nav>

    <ul class="item-grid" data-select="single" id="itemGrid">
      <li class="item-card" data-option data-price="0">
        <div class="item-card__thumb"><span class="shirt" style="--shirt:#5da37b"></span></div>
        <p class="item-card__label">보유 중</p>
      </li>
      <li class="item-card is-active" data-option data-price="120">
        <div class="item-card__thumb"><span class="shirt" style="--shirt:#f2a7b8"></span></div>
        <p class="item-card__price"><img src="../assets/icon/coin-16.svg" alt="코인">120</p>
        <span class="item-card__check"><img src="../assets/icon/check-white.svg" alt="선택됨"></span>
      </li>
      <li class="item-card" data-option data-price="80">
        <div class="item-card__thumb"><span class="shirt" style="--shirt:#e3f0e6"></span></div>
        <p class="item-card__price"><img src="../assets/icon/coin-16.svg" alt="코인">80</p>
        <span class="item-card__check"><img src="../assets/icon/check-white.svg" alt="선택됨"></span>
      </li>
      <li class="item-card" data-option data-price="0">
        <div class="item-card__thumb"><span class="shirt" style="--shirt:#f5d58a"></span></div>
        <p class="item-card__label">보유 중</p>
      </li>
      <li class="item-card" data-option data-price="200">
        <div class="item-card__thumb"><span class="shirt" style="--shirt:#e3f0e6"></span></div>
        <p class="item-card__price"><img src="../assets/icon/coin-16.svg" alt="코인">200</p>
        <span class="item-card__check"><img src="../assets/icon/check-white.svg" alt="선택됨"></span>
      </li>
      <li class="item-card" data-option data-price="mission">
        <div class="item-card__thumb"><span class="shirt" style="--shirt:#f4b183"></span></div>
        <span class="item-card__badge">미션 보상</span>
      </li>
    </ul>

    <button type="button" class="btn btn--primary deco-buy" id="buyBtn">120 코인으로 구매하기</button>

    <nav class="tab-bar" aria-label="메인 메뉴">
      <a href="01-home-private.html" class="tab-bar__item"><img src="../assets/icon/tab-home.svg" alt="">홈</a>
      <a href="05-mission-verify.html" class="tab-bar__item"><img src="../assets/icon/tab-mission.svg" alt=""><img class="tab-bar__badge" src="../assets/icon/badge-dot.svg" alt="새 미션">미션</a>
      <a href="08-customize.html" class="tab-bar__item is-active" aria-current="page"><img src="../assets/icon/tab-shop-active.svg" alt="">쇼핑</a>
      <a href="#" class="tab-bar__item"><img src="../assets/icon/tab-my.svg" alt="">마이</a>
    </nav>
    <span class="home-indicator"></span>
  </div>
  <script src="../js/common.js"></script>
  <script>
    // 선택한 아이템에 따라 구매 버튼 문구 변경
    document.getElementById('itemGrid').addEventListener('click', function (e) {
      var card = e.target.closest('.item-card'); if (!card) return;
      var p = card.dataset.price, btn = document.getElementById('buyBtn');
      btn.textContent = p === '0' ? '착용하기' : p === 'mission' ? '미션 완료 시 획득' : p + ' 코인으로 구매하기';
    });
  </script>
</body>
</html>
