<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 · B4 미션 보내기 | Daily Quest</title>
  <link rel="stylesheet" href="../css/common.css">
  <script src="../js/fit.js"></script>
  <link rel="stylesheet" href="../css/form.css">
</head>
<body>
  <div class="screen">
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <img class="status-bar__ind" src="../assets/icon/status-indicators.svg" alt="">
    </div>
    <header class="page-nav page-nav--plain">
      <a href="13-room-detail.html" class="page-nav__back" aria-label="뒤로가기"><img src="../assets/icon/back.svg" alt=""></a>
      <h1 class="page-nav__title">미션 보내기</h1>
    </header>

    <form id="b4Form" class="page-body page-body--b4" action="13-room-detail.html">
      <span class="form-section-label field-label--first">누구에게?</span>
      <div class="recipient-list" data-select="multi">
        <button type="button" class="recipient is-active" data-option aria-pressed="true">
          <span class="recipient__pic">
            <span class="avatar"><img src="../assets/img/avatar-boy.png" alt=""></span>
            <img class="recipient__ring" src="../assets/icon/selected-ring.svg" alt="">
            <span class="recipient__check"><img src="../assets/icon/check-white.svg" alt=""></span>
          </span>
          <span class="recipient__name">지수</span>
        </button>
        <button type="button" class="recipient" data-option aria-pressed="false">
          <span class="recipient__pic">
            <span class="avatar"><img src="../assets/img/avatar-girl.png" alt=""></span>
            <img class="recipient__ring" src="../assets/icon/selected-ring.svg" alt="">
            <span class="recipient__check"><img src="../assets/icon/check-white.svg" alt=""></span>
          </span>
          <span class="recipient__name">민수</span>
        </button>
        <button type="button" class="recipient" data-option aria-pressed="false">
          <span class="recipient__pic">
            <span class="avatar"><img src="../assets/img/avatar-boy.png" alt=""></span>
            <img class="recipient__ring" src="../assets/icon/selected-ring.svg" alt="">
            <span class="recipient__check"><img src="../assets/icon/check-white.svg" alt=""></span>
          </span>
          <span class="recipient__name">서연</span>
        </button>
      </div>

      <label class="form-section-label" for="missionText">어떤 미션?</label>
      <input id="missionText" class="text-input is-focus" type="text" value="오늘 커피 한 잔 마시기" style="height:54px;font-size:15px;font-weight:500">
      <div class="chip-row" id="suggestions">
        <button type="button" class="chip">산책 10분</button>
        <button type="button" class="chip">물 2L</button>
        <button type="button" class="chip">하늘 찍기</button>
        <button type="button" class="chip">랜덤</button>
      </div>

      <span class="form-section-label">보상 코인</span>
      <div class="coin-options" data-select="single" role="radiogroup" aria-label="보상 코인">
        <button type="button" class="coin-option" data-option aria-pressed="false"><img src="../assets/icon/coin-22.svg" alt="">50</button>
        <button type="button" class="coin-option is-active" data-option aria-pressed="true"><img src="../assets/icon/coin-22.svg" alt="">100</button>
        <button type="button" class="coin-option" data-option aria-pressed="false"><img src="../assets/icon/coin-22.svg" alt="">200</button>
      </div>
      <p class="helper-text" style="font-size:12px;margin-top:12px">내 코인 320 · 미션 완료 시 차감돼요</p>
    </form>

    <div class="bottom-cta bottom-cta--form">
      <button type="submit" form="b4Form" class="btn btn--primary">미션 보내기</button>
    </div>
  </div>
  <script src="../js/common.js"></script>
  <script>
    document.getElementById('suggestions').addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (chip && chip.textContent !== '랜덤') document.getElementById('missionText').value = chip.textContent;
    });
  </script>
</body>
</html>
