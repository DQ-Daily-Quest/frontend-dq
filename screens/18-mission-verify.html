<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18 · 미션 인증 | Daily Quest</title>
  <link rel="stylesheet" href="../css/common.css">
  <script src="../js/fit.js"></script>
  <link rel="stylesheet" href="../css/flow.css">
</head>
<body>
  <form class="screen flow" action="19-verify-check.html">
    <div class="flow__status"><span>9:41</span><span class="flow__status-ind" aria-hidden="true"><i></i><b></b></span></div>
    <h1 class="flow__title">미션 인증</h1>

    <section class="flow-card flow-card--soft" aria-label="미션 정보">
      <h2 class="flow-card__title flow-card__title--md">오늘의 하늘 찍기</h2>
      <p class="flow-card__small">앱 미션 · 커스터마이징 아이템 1개</p>
    </section>

    <label class="flow-preview" id="preview" for="media">사진 / 영상 미리보기</label>
    <label class="btn btn--flow btn--full">사진 / 영상 선택<input class="blind" id="media" type="file" accept="image/*,video/*"></label>

    <label class="flow-card" for="note">
      <span class="flow-card__label">오늘의 순간을 적어주세요</span>
      <textarea id="note" rows="1" maxlength="100" placeholder="예: 수업 끝나고 본 하늘이 정말 맑았어!"></textarea>
    </label>

    <section class="flow-card" aria-label="공유 대상">
      <p class="flow-card__strong">공유할 방  ·  우리들의 아지트</p>
      <p class="flow-card__small">Private · 방 멤버에게만 공개</p>
      <button type="button" class="flow-toggle-row" id="storyToggle" aria-pressed="true"><span>스토리에 표시</span><span data-label>켜짐</span></button>
    </section>

    <p class="flow-note">제출 후 팀원이 수행 여부를 확인해요.</p>
    <button type="submit" class="btn btn--flow btn--full">인증 제출하기</button>
  </form>
  <script>
    // 선택한 사진을 미리보기에 표시
    document.getElementById('media').addEventListener('change', function (e) {
      var f = e.target.files[0], p = document.getElementById('preview');
      if (f && f.type.indexOf('image') === 0) { p.style.backgroundImage = 'url(' + URL.createObjectURL(f) + ')'; p.textContent = ''; }
    });
    var t = document.getElementById('storyToggle');
    t.addEventListener('click', function () {
      var on = t.getAttribute('aria-pressed') !== 'true';
      t.setAttribute('aria-pressed', on);
      t.querySelector('[data-label]').textContent = on ? '켜짐' : '꺼짐';
    });
  </script>
</body>
</html>
