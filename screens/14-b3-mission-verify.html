<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>14 · B3 미션 인증 | Daily Quest</title>
  <link rel="stylesheet" href="../css/common.css">
  <script src="../js/fit.js"></script>
  <link rel="stylesheet" href="../css/form.css">
</head>
<body>
  <div class="screen">
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <img class="status-bar__ind" src="../assets/icon/status-indicators.svg" alt="">
    </div>
    <header class="page-nav page-nav--plain">
      <a href="12-b1-home.html" class="page-nav__back" aria-label="뒤로가기"><img src="../assets/icon/back.svg" alt=""></a>
      <h1 class="page-nav__title">미션 인증</h1>
    </header>

    <form id="b3Form" class="page-body page-body--b3" action="13-room-detail.html">
      <div class="mission-summary mission-summary--sm">
        <span class="mission-summary__icon"><img src="../assets/icon/cloud-24.svg" alt=""></span>
        <div>
          <p class="mission-summary__title">오늘의 하늘 찍기</p>
          <p class="mission-summary__desc">보상 · 랜덤 꾸미기 아이템</p>
        </div>
      </div>

      <label class="upload-area upload-area--lg">
        <span class="upload-area__camera"><img src="../assets/icon/camera-white-32.svg" alt=""></span>
        <span class="upload-area__title">사진 · 동영상 올리기</span>
        <span class="upload-area__desc">탭해서 촬영하거나 앨범에서 선택</span>
        <input class="blind" type="file" accept="image/*,video/*">
      </label>

      <label class="field-label" for="caption">한마디</label>
      <div class="textarea-box textarea-box--lg">
        <textarea id="caption" maxlength="100" placeholder="오늘 하늘은 어땠어? (선택)"></textarea>
      </div>
    </form>

    <div class="bottom-cta bottom-cta--form">
      <button type="submit" form="b3Form" class="btn btn--primary">인증 올리기</button>
    </div>
  </div>
  <script src="../js/common.js"></script>
</body>
</html>
