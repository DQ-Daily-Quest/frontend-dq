<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 · A2 회원가입 · 정보 입력 | Daily Quest</title>
  <link rel="stylesheet" href="../css/common.css">
  <script src="../js/fit.js"></script>
  <link rel="stylesheet" href="../css/form.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="screen">
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <img class="status-bar__ind" src="../assets/icon/status-indicators.svg" alt="">
    </div>
    <header class="page-nav page-nav--plain">
      <a href="09-login.html" class="page-nav__back" aria-label="뒤로가기"><img src="../assets/icon/back.svg" alt=""></a>
      <h1 class="page-nav__title">회원가입</h1>
      <span class="page-nav__step">1 / 2</span>
    </header>
    <div class="signup-progress" role="progressbar" aria-valuemin="1" aria-valuemax="2" aria-valuenow="1">
      <div class="signup-progress__fill" style="width:50%"></div>
    </div>

    <form id="signupForm" class="signup-body" action="11-signup-avatar.html">
      <h2 class="signup-title">반가워요!<br>기본 정보를 알려주세요</h2>

      <label class="field-label" for="email">이메일</label>
      <div class="input-with-btn">
        <div class="icon-input"><input id="email" type="email" value="example@email.com" autocomplete="email" required></div>
        <button type="button" class="btn btn--soft">인증하기</button>
      </div>

      <label class="field-label" for="pw">비밀번호</label>
      <div class="icon-input">
        <input id="pw" type="password" placeholder="영문, 숫자 포함 8자 이상" minlength="8" autocomplete="new-password" required>
        <button type="button" class="icon-input__eye" data-toggle-password aria-label="비밀번호 보기"><img src="../assets/icon/eye.svg" alt=""></button>
      </div>
      <p class="input-hint">영문 · 숫자 포함 8자 이상</p>

      <label class="field-label" for="pw2">비밀번호 확인</label>
      <div class="icon-input">
        <input id="pw2" type="password" placeholder="비밀번호를 한 번 더 입력" autocomplete="new-password" required>
        <button type="button" class="icon-input__eye" data-toggle-password aria-label="비밀번호 보기"><img src="../assets/icon/eye.svg" alt=""></button>
      </div>

      <label class="field-label" for="nick">닉네임</label>
      <div class="icon-input">
        <input id="nick" type="text" placeholder="친구들에게 보일 이름" minlength="2" maxlength="10" required>
      </div>
      <p class="input-hint">2~10자 · 방 멤버들에게 표시돼요</p>

      <fieldset class="agreements" style="border:0;margin-top:12px">
        <legend class="blind">약관 동의</legend>
        <label class="agree-all">
          <input class="blind" type="checkbox" id="agreeAll" checked>
          <span class="agree-all__box"><img src="../assets/icon/check-white-12.svg" alt=""></span>
          전체 동의
        </label>
        <label class="agree-item">
          <input class="blind" type="checkbox" name="agree" checked required>
          <img class="agree-item__on" src="../assets/icon/check-on.svg" alt="">
          <img class="agree-item__off" src="../assets/icon/check-off.svg" alt="">
          <span class="agree-item__text">[필수] 이용약관 동의</span>
          <a href="#" class="agree-item__more" aria-label="이용약관 보기"><img src="../assets/icon/chevron-right.svg" alt=""></a>
        </label>
        <label class="agree-item">
          <input class="blind" type="checkbox" name="agree" checked required>
          <img class="agree-item__on" src="../assets/icon/check-on.svg" alt="">
          <img class="agree-item__off" src="../assets/icon/check-off.svg" alt="">
          <span class="agree-item__text">[필수] 개인정보 수집 · 이용 동의</span>
          <a href="#" class="agree-item__more" aria-label="개인정보 수집 · 이용 보기"><img src="../assets/icon/chevron-right.svg" alt=""></a>
        </label>
        <label class="agree-item">
          <input class="blind" type="checkbox" name="agree">
          <img class="agree-item__on" src="../assets/icon/check-on.svg" alt="">
          <img class="agree-item__off" src="../assets/icon/check-off.svg" alt="">
          <span class="agree-item__text">[선택] 마케팅 알림 수신</span>
          <a href="#" class="agree-item__more" aria-label="마케팅 알림 수신 보기"><img src="../assets/icon/chevron-right.svg" alt=""></a>
        </label>
      </fieldset>
    </form>

    <div class="bottom-cta bottom-cta--form">
      <button type="submit" form="signupForm" class="btn btn--primary">다음</button>
    </div>
  </div>
  <script src="../js/common.js"></script>
  <script>
    var all = document.getElementById('agreeAll');
    var items = document.querySelectorAll('input[name="agree"]');
    all.addEventListener('change', function () { items.forEach(function (i) { i.checked = all.checked; }); });
    items.forEach(function (i) {
      i.addEventListener('change', function () { all.checked = Array.prototype.every.call(items, function (x) { return x.checked; }); });
    });
  </script>
</body>
</html>
