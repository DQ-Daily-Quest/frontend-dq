<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06 · 인증 확인 (팀원 투표) | Daily Quest</title>
  <link rel="stylesheet" href="../css/common.css">
  <script src="../js/fit.js"></script>
  <link rel="stylesheet" href="../css/form.css">
</head>
<body>
  <div class="screen">
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <img class="status-bar__ind" src="../assets/icon/status-indicators.svg" alt="">
    </div>
    <header class="page-nav">
      <a href="03-room.html" class="page-nav__back" aria-label="뒤로가기"><img src="../assets/icon/back.svg" alt=""></a>
      <h1 class="page-nav__title">인증 확인하기</h1>
    </header>

    <main class="page-body">
      <p class="queue-chip">확인 대기 3개 중 1번째</p>

      <div class="poster">
        <img src="../assets/img/avatar-story-42-boy.svg" alt="">
        <div>
          <p class="poster__name">민수</p>
          <p class="poster__desc">지수가 보낸 미션 · 10분 동안 산책하기</p>
        </div>
      </div>

      <div class="proof-media" role="img" aria-label="민수의 인증 영상">
        <img class="proof-media__scene" src="../assets/img/park.svg" alt="">
        <span class="proof-media__time">00:12 영상</span>
      </div>
      <p class="proof-caption">동네 한 바퀴 돌고 옴! 12분 걸었어요</p>

      <div class="vote-head">
        <h2 class="vote-head__title">투표 현황</h2>
        <span class="reward-pill"><img src="../assets/icon/coin-sm.svg" alt="">+100 보상</span>
      </div>
      <ul class="vote-list">
        <li class="vote-row">
          <span class="avatar"><img src="../assets/img/avatar-girl.png" alt=""></span>
          <span class="vote-row__name">지수</span>
          <span class="vote-chip"><img src="../assets/icon/check-green.svg" alt="">통과</span>
        </li>
        <li class="vote-row">
          <span class="avatar"><img src="../assets/img/avatar-boy.png" alt=""></span>
          <span class="vote-row__name">서연</span>
          <span class="vote-chip"><img src="../assets/icon/check-green.svg" alt="">통과</span>
        </li>
        <li class="vote-row">
          <span class="avatar"><img src="../assets/img/avatar-girl.png" alt=""></span>
          <span class="vote-row__name">나</span>
          <span class="vote-chip vote-chip--wait">대기</span>
        </li>
      </ul>
      <p class="vote-note">과반수 통과 시 자동 완료 · 반려 시 사유를 남겨주세요</p>
    </main>

    <div class="bottom-cta bottom-cta--form bottom-cta--split">
      <button type="button" class="btn btn--outline">반려</button>
      <button type="button" class="btn btn--primary">통과!</button>
    </div>
  </div>
</body>
</html>
