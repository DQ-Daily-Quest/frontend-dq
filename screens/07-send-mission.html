<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>07 · 미션 보내기 | Daily Quest</title>
  <link rel="stylesheet" href="../css/common.css">
  <script src="../js/fit.js"></script>
  <link rel="stylesheet" href="../css/form.css">
</head>
<body>
  <div class="screen">
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <img class="status-bar__ind" src="../assets/icon/status-indicators.svg" alt="">
    </div>
    <header class="page-nav">
      <a href="03-room.html" class="page-nav__back" aria-label="뒤로가기"><img src="../assets/icon/back.svg" alt=""></a>
      <h1 class="page-nav__title">미션 보내기</h1>
    </header>

    <form id="sendForm" class="page-body" action="03-room.html">
      <span class="form-section-label field-label--first">누구에게 보낼까?</span>
      <div class="recipient-list" data-select="multi">
        <button type="button" class="recipient is-active" data-option aria-pressed="true">
          <span class="recipient__pic">
            <span class="avatar"><img src="../assets/img/avatar-boy.png" alt=""></span>
            <img class="recipient__ring" src="../assets/icon/selected-ring.svg" alt="">
            <span class="recipient__check"><img src="../assets/icon/check-white.svg" alt=""></span>
          </span>
          <span class="recipient__name">지수</span>
        </button>
        <button type="button" class="recipient" data-option aria-pressed="false">
          <span class="recipient__pic">
            <span class="avatar"><img src="../assets/img/avatar-girl.png" alt=""></span>
            <img class="recipient__ring" src="../assets/icon/selected-ring.svg" alt="">
            <span class="recipient__check"><img src="../assets/icon/check-white.svg" alt=""></span>
          </span>
          <span class="recipient__name">민수</span>
        </button>
        <button type="button" class="recipient is-active" data-option aria-pressed="true">
          <span class="recipient__pic">
            <span class="avatar"><img src="../assets/img/avatar-boy.png" alt=""></span>
            <img class="recipient__ring" src="../assets/icon/selected-ring.svg" alt="">
            <span class="recipient__check"><img src="../assets/icon/check-white.svg" alt=""></span>
          </span>
          <span class="recipient__name">서연</span>
        </button>
        <button type="button" class="recipient" id="selectAll">
          <span class="recipient__pic"><span class="recipient__all"><img src="../assets/icon/users-lg.svg" alt=""></span></span>
          <span class="recipient__name">전체</span>
        </button>
      </div>

      <label class="form-section-label" for="missionText">미션 내용</label>
      <input id="missionText" class="text-input is-focus" type="text" value="오늘 커피 한 잔 마시기" style="height:50px;font-size:14.5px;font-weight:500">
      <div class="chip-row chip-row--scroll chip-row--tight" id="suggestions">
        <button type="button" class="chip">산책 10분</button>
        <button type="button" class="chip">물 2L 마시기</button>
        <button type="button" class="chip">하늘 찍기</button>
        <button type="button" class="chip">랜덤 추천</button>
      </div>

      <span class="form-section-label">인증 방식</span>
      <div class="chip-row" style="margin-top:0" data-select="single" role="radiogroup">
        <button type="button" class="chip is-active" data-option aria-pressed="true">사진</button>
        <button type="button" class="chip" data-option aria-pressed="false">동영상</button>
        <button type="button" class="chip" data-option aria-pressed="false">글</button>
      </div>

      <span class="form-section-label">기한</span>
      <div class="chip-row" style="margin-top:0" data-select="single" role="radiogroup">
        <button type="button" class="chip is-active" data-option aria-pressed="true">오늘</button>
        <button type="button" class="chip" data-option aria-pressed="false">3일</button>
        <button type="button" class="chip" data-option aria-pressed="false">일주일</button>
      </div>

      <span class="form-section-label">보상 코인</span>
      <div class="stepper" data-stepper data-min="0" data-max="320" data-step="10" data-balance="320">
        <button type="button" class="stepper__btn" data-dec aria-label="코인 줄이기"><img src="../assets/icon/minus.svg" alt=""></button>
        <span class="stepper__value"><img src="../assets/icon/coin-22.svg" alt="코인"><output data-value>100</output></span>
        <button type="button" class="stepper__btn stepper__btn--plus" data-inc aria-label="코인 늘리기"><img src="../assets/icon/plus-white.svg" alt=""></button>
      </div>
      <p class="helper-text" data-stepper-helper>내 코인 320 → 220 (미션 완료 시 차감)</p>

      <div class="decision-note">
        <img src="../assets/icon/alert.svg" alt="">
        <div>
          <p class="decision-note__title">기획 결정 필요 · 보상 재원</p>
          <p class="decision-note__desc">보낸 사람 코인 차감 vs 앱이 고정 지급</p>
        </div>
      </div>
    </form>

    <div class="bottom-cta bottom-cta--form">
      <button type="submit" form="sendForm" class="btn btn--primary">미션 보내기</button>
    </div>
  </div>
  <script src="../js/common.js"></script>
  <script>
    // 추천 칩 → 미션 내용 입력
    document.getElementById('suggestions').addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (chip && chip.textContent !== '랜덤 추천') document.getElementById('missionText').value = chip.textContent;
    });
    // 전체 선택
    document.getElementById('selectAll').addEventListener('click', function () {
      document.querySelectorAll('.recipient[data-option]').forEach(function (r) {
        r.classList.add('is-active'); r.setAttribute('aria-pressed', 'true');
      });
    });
  </script>
</body>
</html>
