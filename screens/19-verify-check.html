<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>19 · 인증 확인 | Daily Quest</title>
  <link rel="stylesheet" href="../css/common.css">
  <script src="../js/fit.js"></script>
  <link rel="stylesheet" href="../css/flow.css">
</head>
<body>
  <div class="screen flow">
    <div class="flow__status"><span>9:41</span><span class="flow__status-ind" aria-hidden="true"><i></i><b></b></span></div>
    <h1 class="flow__title">인증 확인</h1>

    <section class="flow-card" aria-label="인증 작성자">
      <p class="flow-card__strong flow-card__strong--lg">지원  ·  우리들의 아지트</p>
      <p class="flow-card__muted">오늘의 하늘 찍기  /  방금 전</p>
    </section>

    <img class="flow-photo" src="../assets/img/photo-sky.png" alt="지원의 인증 사진">
    <p class="flow-quote">“수업 끝나고 본 오늘의 하늘!”</p>

    <section class="flow-card flow-card--soft" aria-label="확인 상태">
      <h2 class="flow-card__title flow-card__title--sm">팀원 확인 중</h2>
      <p class="flow-card__small">현재 확인 1명 · 내 확인을 기다리고 있어요</p>
      <p class="flow-card__tiny">승인 기준과 보상 지급 시점은 기획 확정 예정</p>
    </section>

    <button type="button" class="btn btn--flow btn--full">수행 확인하기</button>
    <button type="button" class="btn btn--flow btn--full">다시 인증 요청</button>

    <p class="flow-legend">앱 미션 → 아이템<br>멤버 미션 → 코인</p>
  </div>
</body>
</html>
