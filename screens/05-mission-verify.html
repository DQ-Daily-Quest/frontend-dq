<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05 · 미션 인증하기 | Daily Quest</title>
  <link rel="stylesheet" href="../css/common.css">
  <script src="../js/fit.js"></script>
  <link rel="stylesheet" href="../css/form.css">
</head>
<body>
  <div class="screen">
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <img class="status-bar__ind" src="../assets/icon/status-indicators.svg" alt="">
    </div>
    <header class="page-nav">
      <a href="01-home-private.html" class="page-nav__back" aria-label="뒤로가기"><img src="../assets/icon/back.svg" alt=""></a>
      <h1 class="page-nav__title">미션 인증하기</h1>
    </header>

    <form id="verifyForm" class="page-body" action="03-room.html">
      <div class="mission-summary">
        <span class="mission-summary__icon"><img src="../assets/icon/cloud-lg.svg" alt=""></span>
        <div>
          <p class="mission-summary__title">오늘의 하늘 찍기</p>
          <p class="mission-summary__desc">앱 미션 · 보상 랜덤 꾸미기 아이템 1개 · 오늘 자정까지</p>
        </div>
      </div>

      <div class="upload-area">
        <label class="upload-area__camera" aria-label="사진 · 동영상 찍기">
          <img src="../assets/icon/camera-white.svg" alt="">
          <input class="blind" type="file" accept="image/*,video/*" capture="environment">
        </label>
        <p class="upload-area__title">사진 · 동영상 찍기</p>
        <p class="upload-area__desc">최대 30초 · 지금 이 순간을 담아줘!</p>
        <label class="upload-area__album">
          <img src="../assets/icon/image.svg" alt="">앨범에서 선택
          <input class="blind" type="file" accept="image/*,video/*">
        </label>
      </div>

      <label class="field-label" for="caption">한마디</label>
      <div class="textarea-box">
        <textarea id="caption" maxlength="100" placeholder="오늘 하늘은 어땠어? (선택)"></textarea>
        <span class="textarea-box__count">0 / 100</span>
      </div>

      <label class="toggle-card">
        <span>
          <span class="toggle-card__title" style="display:block">스토리에도 올리기</span>
          <span class="toggle-card__desc" style="display:block">멤버들 화면에서 내 프로필에 링이 생겨요</span>
        </span>
        <span class="switch">
          <input type="checkbox" checked aria-label="스토리에도 올리기">
          <img src="../assets/icon/switch-on.svg" alt="">
          <span class="switch__off"></span>
        </span>
      </label>

      <p class="info-note"><img src="../assets/icon/info.svg" alt="">멤버 과반수가 "통과"하면 보상이 지급돼요</p>

    </form>
    <div class="bottom-cta bottom-cta--form">
      <button type="submit" form="verifyForm" class="btn btn--primary">인증 올리기</button>
    </div>
  </div>
  <script src="../js/common.js"></script>
</body>
</html>
